<!-- perfeito.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Número Perfeito</title>
</head>
<body>
  <h2>Verificar Número Perfeito</h2>
  <input type="number" id="numero" placeholder="Digite um número">
  <button onclick="verificar()">Verificar</button>
  <p id="resultado"></p>

  <script>
    function verificar() {
      const n = parseInt(document.getElementById("numero").value);
      if (isNaN(n) || n <= 0) return resultado.textContent = "Digite um número válido.";
      let soma = 0;
      for (let i = 1; i < n; i++) {
        if (n % i === 0) soma += i;
      }
      resultado.textContent = soma === n ? `${n} é perfeito` : `${n} não é perfeito`;
    }
  </script>
</body>
</html>
