<!-- calculadora.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
</head>
<body>
  <h2>Calculadora</h2>
  <input type="number" id="num1" placeholder="Número 1">
  <input type="number" id="num2" placeholder="Número 2 (quando necessário)">
  <select id="operacao">
    <option value="+">Soma</option>
    <option value="-">Subtração</option>
    <option value="*">Multiplicação</option>
    <option value="/">Divisão</option>
    <option value="**">Potência</option>
    <option value="sqrt">Raiz quadrada (num1)</option>
  </select>
  <button onclick="calcular()">Calcular</button>
  <p id="resultado"></p>

  <script>
    function calcular() {
      const num1 = parseFloat(document.getElementById("num1").value);
      const num2 = parseFloat(document.getElementById("num2").value);
      const op = document.getElementById("operacao").value;
      let res;
      if (op === "sqrt") {
        res = Math.sqrt(num1);
      } else {
        if (isNaN(num1) || isNaN(num2)) return resultado.textContent = "Digite dois números válidos.";
        res = eval(`${num1} ${op} ${num2}`);
      }
      resultado.textContent = `Resultado: ${res}`;
    }
  </script>
</body>
</html>
