<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Verificador de Número Primo</title>
</head>
<body>
  <h2>Verificador de Número Primo</h2>

  <!-- Campo de entrada do número -->
  <label for="numero">Digite um número:</label>
  <input type="number" id="numero" />

  <!-- Botão para verificar -->
  <button onclick="verificarPrimo()">Verificar</button>

  <!-- Área de resultado -->
  <p id="resultado"></p>

  <script>
    function verificarPrimo() {
      const numero = parseInt(document.getElementById('numero').value);
      const resultado = document.getElementById('resultado');

      // Validação: número deve ser maior que 1
      if (isNaN(numero) || numero <= 1) {
        resultado.textContent = 'Por favor, insira um número inteiro maior que 1.';
        return;
      }

      // Verifica se é primo
      let ehPrimo = true;
      for (let i = 2; i <= Math.sqrt(numero); i++) {
        if (numero % i === 0) {
          ehPrimo = false;
          break;
        }
      }

      // Exibe o resultado
      if (ehPrimo) {
        resultado.textContent = `${numero} é um número primo. ✅`;
      } else {
        resultado.textContent = `${numero} não é primo. ❌`;
      }
    }
  </script>
</body>
</html>
