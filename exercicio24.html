<!-- estatisticas.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Média, Mediana e Moda</title>
</head>
<body>
  <h2>Estatísticas</h2>
  <input type="text" id="valores" placeholder="Ex: 1,2,2,3,4">
  <button onclick="calcular()">Calcular</button>
  <p id="resultado"></p>

  <script>
    function calcular() {
      const valores = document.getElementById("valores").value.split(",").map(Number).filter(n => !isNaN(n));
      if (!valores.length) return resultado.textContent = "Digite valores válidos.";

      // Média
      const media = valores.reduce((a, b) => a + b, 0) / valores.length;

      // Mediana
      valores.sort((a, b) => a - b);
      const meio = Math.floor(valores.length / 2);
      const mediana = valores.length % 2 === 0 ? (valores[meio - 1] + valores[meio]) / 2 : valores[meio];

      // Moda
      const freq = {};
      valores.forEach(v => freq[v] = (freq[v] || 0) + 1);
      const maxFreq = Math.max(...Object.values(freq));
      const moda = Object.keys(freq).filter(k => freq[k] === maxFreq).join(", ");

      resultado.innerHTML = `Média: ${media.toFixed(2)}<br>Mediana: ${mediana}<br>Moda: ${moda}`;
    }
  </script>
</body>
</html>
