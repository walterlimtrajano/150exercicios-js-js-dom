<!-- primos.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Números Primos</title>
</head>
<body>
  <h2>Exibir Números Primos</h2>
  <input type="number" id="numero" placeholder="Digite um número até N">
  <button onclick="exibirPrimos()">Exibir</button>
  <p id="resultado"></p>

  <script>
    function exibirPrimos() {
      const n = parseInt(document.getElementById("numero").value);
      if (isNaN(n) || n < 2) return resultado.textContent = "Digite um número válido.";
      
      const primos = [];
      for (let i = 2; i <= n; i++) {
        if (isPrimo(i)) primos.push(i);
      }
      resultado.textContent = `Números primos até ${n}: ${primos.join(', ')}`;
    }

    function isPrimo(num) {
      for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
      }
      return num > 1;
    }
  </script>
</body>
</html>
