<!-- formulario-contato.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Contato</title>
</head>
<body>
  <h2>Formulário de Contato</h2>
  <form id="formContato">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" required><br><br>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" required></textarea><br><br>

    <button type="button" onclick="validarFormulario()">Enviar</button>
  </form>
  <p id="resultado"></p>

  <script>
    function validarFormulario() {
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const mensagem = document.getElementById("mensagem").value.trim();

      if (!nome || !email || !mensagem) {
        resultado.textContent = "Todos os campos são obrigatórios.";
        return;
      }
      resultado.textContent = "Formulário enviado com sucesso!";
      document.getElementById("formContato").reset();
    }
  </script>
</body>
</html>
