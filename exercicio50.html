<!-- dia-da-semana.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dia da Semana</title>
</head>
<body>
  <h2>Exibir o Dia da Semana</h2>
  <input type="date" id="data">
  <button onclick="exibirDiaSemana()">Exibir Dia da Semana</button>
  <p id="resultado"></p>

  <script>
    function exibirDiaSemana() {
      const data = new Date(document.getElementById("data").value);
      if (isNaN(data)) return resultado.textContent = "Digite uma data válida.";

      const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
      const diaSemana = diasSemana[data.getDay()];

      resultado.textContent = `Dia da Semana: ${diaSemana}`;
    }
  </script>
</body>
</html>
