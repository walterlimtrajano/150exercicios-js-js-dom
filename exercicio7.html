<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fatorial</title>
</head>
<body>
  <h2>Calcular Fatorial</h2>
  <input type="number" id="numero" placeholder="Digite um número">
  <button onclick="calcularFatorial()">Calcular</button>
  <p id="resultado"></p>

  <script>
    function calcularFatorial() {
      let n = parseInt(document.getElementById("numero").value);
      if (isNaN(n) || n < 0) return resultado.textContent = "Digite um número inteiro positivo.";
      let f = 1;
      for (let i = 2; i <= n; i++) f *= i;
      resultado.textContent = `Fatorial de ${n} é ${f}`;
    }
  </script>
</body>
</html>
