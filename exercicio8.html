<!-- dados.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dados</title>
</head>
<body>
  <h2>Simulador de Dados</h2>
  <button onclick="lançarDados()">Lançar Dados</button>
  <p id="resultado"></p>

  <script>
    function lançarDados() {
      const dado1 = Math.floor(Math.random() * 6) + 1;
      const dado2 = Math.floor(Math.random() * 6) + 1;
      resultado.textContent = `Dado 1: ${dado1}, Dado 2: ${dado2}, Soma: ${dado1 + dado2}`;
    }
  </script>
</body>
</html>
